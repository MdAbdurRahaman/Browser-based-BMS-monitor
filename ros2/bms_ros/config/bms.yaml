# ROS parameters for bms_node.
# port/protocol/baud/rate/timeout normally come from the .env file.
# Leave them at auto / 0 to use .env (or auto-detect); set a value here to override it.
bms:
  ros__parameters:
    port: auto          # e.g. /dev/ttyUSB0 or /dev/serial/by-id/...
    protocol: auto      # daly | jbd
    baud: 0             # 0 = .env value or 9600
    rate: 0.0           # readings per second; 0 = .env value or 1.0
    timeout: 0.0        # seconds per reply; 0 = .env value or 0.6
    env_file: ""        # path to a .env file; empty = search the usual places
    frame_id: battery   # header.frame_id of battery_state
    debug_frames: false # log every byte sent and received
